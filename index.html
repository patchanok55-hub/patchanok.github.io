<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color"
        content="#8b7cf6">

  <title>
    พื้นที่ใจดี | โปรแกรมจัดการความเครียด
  </title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --primary: #8b7cf6;
      --primary-dark: #6d5ce7;
      --pink: #f5a6c8;
      --lavender: #f2efff;
      --mint: #eaf9f4;
      --yellow: #fff7dc;
      --text: #35324a;
      --muted: #77748a;
      --white: #ffffff;

      --shadow:
        0 12px 35px rgba(92, 78, 145, 0.12);

      --radius: 24px;
    }


    html {
      scroll-behavior: smooth;
    }


    body {
      font-family:
        "Noto Sans Thai",
        "Prompt",
        system-ui,
        sans-serif;

      background:
        linear-gradient(
          180deg,
          #faf9ff 0%,
          #ffffff 50%,
          #f8fbff 100%
        );

      color: var(--text);
      line-height: 1.7;
    }


    a {
      color: inherit;
      text-decoration: none;
    }


    .container {
      width: min(
        1120px,
        calc(100% - 32px)
      );

      margin: auto;
    }


    /* =========================
       NAVBAR
    ========================= */

    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;

      background:
        rgba(255,255,255,0.92);

      backdrop-filter: blur(14px);

      border-bottom:
        1px solid rgba(139,124,246,0.12);
    }


    .nav-inner {
      min-height: 70px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }


    .brand {
      display: flex;
      align-items: center;

      gap: 10px;

      font-weight: 800;

      color: var(--primary-dark);

      white-space: nowrap;
    }


    .brand-icon {
      width: 42px;
      height: 42px;

      display: grid;
      place-items: center;

      border-radius: 14px;

      background: var(--lavender);

      font-size: 23px;
    }


    .nav-links {
      display: flex;

      gap: 8px;

      flex-wrap: wrap;

      justify-content: flex-end;
    }


    .nav-links a {
      padding:
        8px 13px;

      border-radius: 12px;

      color: var(--muted);

      font-size: 14px;

      transition: 0.2s;
    }


    .nav-links a:hover {
      background: var(--lavender);

      color: var(--primary-dark);
    }


    /* =========================
       HERO
    ========================= */

    .hero {
      padding:
        68px 0 48px;
    }


    .hero-grid {
      display: grid;

      grid-template-columns:
        1.15fr 0.85fr;

      gap: 35px;

      align-items: center;
    }


    .eyebrow {
      display: inline-flex;

      align-items: center;

      gap: 8px;

      padding:
        7px 13px;

      background:
        var(--lavender);

      color:
        var(--primary-dark);

      border-radius: 999px;

      font-size: 14px;

      font-weight: 700;

      margin-bottom: 18px;
    }


    h1 {
      font-size:
        clamp(36px, 6vw, 62px);

      line-height: 1.12;

      letter-spacing: -1px;

      margin-bottom: 18px;
    }


    .gradient-text {
      background:
        linear-gradient(
          90deg,
          #7160e9,
          #d67ea8
        );

      -webkit-background-clip: text;

      background-clip: text;

      color: transparent;
    }


    .hero p {
      color: var(--muted);

      font-size: 17px;

      max-width: 650px;

      margin-bottom: 26px;
    }


    .hero-buttons {
      display: flex;

      gap: 12px;

      flex-wrap: wrap;
    }


    .btn {
      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 8px;

      min-height: 48px;

      padding:
        0 20px;

      border-radius: 15px;

      font-weight: 750;

      transition:
        transform 0.2s,
        box-shadow 0.2s;

      border: 0;

      cursor: pointer;
    }


    .btn:hover {
      transform:
        translateY(-2px);

      box-shadow:
        0 9px 22px
        rgba(92,78,145,0.15);
    }


    .btn-primary {
      background:
        var(--primary);

      color: white;
    }


    .btn-secondary {
      background: white;

      color:
        var(--primary-dark);

      border:
        1px solid #e8e3ff;
    }


    /* =========================
       HERO CARD
    ========================= */

    .hero-card {
      position: relative;

      background: white;

      border-radius: 34px;

      padding: 30px;

      box-shadow: var(--shadow);

      border:
        1px solid #eeeaff;

      overflow: hidden;
    }


    .hero-card::before {
      content: "";

      position: absolute;

      width: 180px;
      height: 180px;

      background:
        #eeeaff;

      border-radius: 50%;

      top: -80px;
      right: -70px;
    }


    .dragon {
      font-size: 78px;

      text-align: center;

      margin:
        10px 0 14px;

      position: relative;
    }


    .hero-card h3 {
      text-align: center;

      margin-bottom: 7px;

      position: relative;
    }


    .hero-card p {
      text-align: center;

      font-size: 14px;

      margin: 0;

      position: relative;
    }


    /* =========================
       SECTION
    ========================= */

    section {
      padding:
        42px 0;
    }


    .section-title {
      text-align: center;

      margin-bottom: 28px;
    }


    .section-title h2 {
      font-size: 30px;

      margin-bottom: 6px;
    }


    .section-title p {
      color: var(--muted);

      font-size: 15px;
    }


    /* =========================
       ACTIVITY CARDS
    ========================= */

    .cards {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 17px;
    }


    .card {
      background: white;

      border:
        1px solid #eeeaf8;

      border-radius:
        var(--radius);

      padding: 22px;

      box-shadow:
        0 8px 25px
        rgba(92,78,145,0.07);

      transition: 0.2s;
    }


    .card:hover {
      transform:
        translateY(-4px);

      box-shadow:
        var(--shadow);
    }


    .card-icon {
      width: 54px;
      height: 54px;

      border-radius: 17px;

      display: grid;

      place-items: center;

      font-size: 27px;

      margin-bottom: 15px;
    }


    .purple {
      background:
        var(--lavender);
    }


    .pink {
      background:
        #fff0f6;
    }


    .mint {
      background:
        var(--mint);
    }


    .yellow {
      background:
        var(--yellow);
    }


    .card h3 {
      font-size: 18px;

      margin-bottom: 7px;
    }


    .card p {
      color: var(--muted);

      font-size: 14px;

      min-height: 68px;

      margin-bottom: 14px;
    }


    .card-link {
      display: inline-flex;

      color:
        var(--primary-dark);

      font-weight: 750;

      font-size: 14px;
    }


    /* =========================
       PROGRAM
    ========================= */

    .program {
      background:
        #f8f6ff;
    }


    .program-grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 18px;
    }


    .program-item {
      background: white;

      padding: 23px;

      border-radius: 20px;

      border:
        1px solid #eeeaff;
    }


    .program-number {
      width: 34px;
      height: 34px;

      border-radius: 11px;

      background:
        var(--primary);

      color: white;

      display: grid;

      place-items: center;

      font-weight: 800;

      margin-bottom: 12px;
    }


    .program-item h3 {
      font-size: 17px;

      margin-bottom: 6px;
    }


    .program-item p {
      color: var(--muted);

      font-size: 14px;
    }


    /* =========================
       HELP
    ========================= */

    .notice {
      background:
        linear-gradient(
          135deg,
          #fff7fb,
          #f3f1ff
        );

      border:
        1px solid #eee5f5;

      border-radius: 26px;

      padding: 25px;

      display: flex;

      gap: 18px;

      align-items: flex-start;
    }


    .notice-icon {
      font-size: 30px;

      flex: 0 0 auto;
    }


    .notice h3 {
      margin-bottom: 5px;
    }


    .notice p {
      color: var(--muted);

      font-size: 14px;
    }


    /* =========================
       FOOTER
    ========================= */

    footer {
      margin-top: 35px;

      padding:
        30px 0 42px;

      border-top:
        1px solid #eeeaf5;

      color: var(--muted);

      text-align: center;

      font-size: 13px;
    }


    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 900px) {

      .hero-grid {
        grid-template-columns: 1fr;
      }

      .cards {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .program-grid {
        grid-template-columns:
          repeat(2, 1fr);
      }

      .hero {
        padding-top: 42px;
      }

    }


    @media (max-width: 600px) {

      .nav-inner {
        padding: 8px 0;
      }

      .nav-links {
        display: none;
      }

      .cards,
      .program-grid {
        grid-template-columns: 1fr;
      }

      .hero p {
        font-size: 15px;
      }

      .notice {
        flex-direction: column;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       NAVIGATION
  ========================== -->

  <header class="navbar">

    <div class="container nav-inner">

      <a
        class="brand"
        href="#home"
      >

        <span class="brand-icon">
          💜
        </span>

        <span>
          พื้นที่ใจดี
        </span>

      </a>


      <nav
        class="nav-links"
        aria-label="เมนูหลัก"
      >

        <a href="#home">
          หน้าแรก
        </a>

        <a href="#activities">
          กิจกรรม
        </a
